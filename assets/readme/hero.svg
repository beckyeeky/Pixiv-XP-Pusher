<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Pixiv-XP-Pusher</title>
  <desc id="desc">A Pixiv favorites pipeline that builds a preference profile, finds diverse illustrations, and delivers them to your chosen notifier.</desc>
