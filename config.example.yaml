# Pixiv XP Pusher 配置文件示例
# 请复制此文件为 config.yaml 并填入您的真实信息

# 启用的功能策略
strategies:
  - xp_search # 基于 XP 画像的每日搜索推荐
  - related # 连锁反应 (点赞后推送关联作品)
  - ranking # 每日排行榜推送
  - subscription # 关注画师的更新推送

profiler:
  # AI 标签分析配置
  ai:
    enabled: true
    # AI 提供商: openai / gemini / claude (目前主要支持 openai 格式)
    provider: "openai"
    # API 密钥
    api_key: "YOUR_OPENAI_API_KEY_HERE"
    # API 基础地址 (如果使用中转服务)
    base_url: "https://api.openai.com/v1"
    # 模型名称
    model: "gpt-4o-mini"
    # 并发请求数 (建议 5-20)
    concurrency: 10
    # 批次大小
    batch_size: 200

    # 标签清洗配置
    filter_meaningless: true
    merge_synonyms: true

  # 标签画像配置
  scan_limit: 1000 # 扫描收藏数量上限
  discovery_rate: 0.1 # 探索新 Tag 的概率 (0.1 = 10%)
  time_decay_days: 180 # 时间衰减半衰期（天），权重随时间降低
  saturation_threshold: 0.5 # 高频 Tag 饱和度阈值 (0-1)，超过此比例自动过滤

  # 画像生成时保留权重最高的 N 个标签
  top_n: 20
  # 是否包含私密收藏用于分析
  include_private: true

  # 可选：本地 IP 标签表。未设置时不会对 IP 标签做额外处理
  ip_tags_file: ""
  # IP 标签在画像中的权重折扣 (0-1，1 表示不降权)
  ip_weight_discount: 1.0

  # 停用词 (手动指定)
  stop_words:
    - original
    - manga
    - pixiv
    - illustration

# AI 增强配置 (可选，默认关闭)
ai:
  # Embedding 语义匹配 - 借鉴 X 算法 Two-Tower Model
  # 使用向量相似度替代简单 Tag 交集匹配，提升推荐精准度
  embedding:
    enabled: false # 是否启用 (默认关闭)
    model: embedding_small # 从 Models 中选择 capabilities=embedding 的 Model
    dimensions: 256 # 向量维度 (越低越省存储, 256/512/1024)
    semantic_weight: 0.3 # 语义分数权重 (0-1, 与 Tag 分数加权)
    cache_ttl_days: 30 # Embedding 缓存天数

  # AI 评分器 (LLM 精排，对候选作品进行二次评分)
  scorer:
    enabled: false # 是否启用
    model: deepseek_flash # 从 Models 中选择 capabilities=llm 的 Model
    max_candidates: 50 # 候选超过此数量时跳过 AI 评分
    score_weight: 0.3 # AI 分数权重 (用于与基础分数混合)

providers:
  # Pixiv 与 Danbooru 是各自唯一的 typed Provider；凭据只能在本机配置中保存。
  pixiv:
    type: pixiv
    refresh_token: "YOUR_REFRESH_TOKEN_HERE"
    sync_token: ""
    user_id: 0
  danbooru:
    type: danbooru
    login: ""
    api_key: ""
    base_url: "https://danbooru.donmai.us"

  # LLM Provider 持有凭据。custom OpenAI-compatible 可用于私有网关或目录外服务。
  deepseek:
    type: openai_compatible
    api_key: ""
    base_url: "https://api.deepseek.com/v1"

models:
  # Model 只引用一个 Provider；多个 Judge 可选择不同的 Model。
  deepseek_flash:
    provider: deepseek
    model: "deepseek-v4-flash"
    capabilities: [llm]

  embedding_small:
    provider: deepseek
    model: "text-embedding-3-small"
    capabilities: [embedding]

  # openai_mini:
  #   provider: openai
  #   model: "gpt-4o-mini"

tag_classifier:
  enabled: false # 启用后维护可接受的 Feature / Character / Copyright 等类别
  ttl_days: 30
  batch_size: 50
  concurrency: 5
  maintenance:
    max_tags_per_run: 40 # 每次仅刷新高影响画像标签，避免全量重跑
    min_profile_weight: 0.0
    prefer_unresolved_first: true
  # Judge 从已配置的 Model 中选择；每个不同 Provider+Model 身份各投一票。
  judges: [deepseek_flash]
  danbooru:
    enabled: false # 只查询画像中出现的标签；无需镜像完整标签库
    timeout_seconds: 15 # 不可用时会继续使用缓存证据与 Judge 投票

scheduler:
  # 定时任务配置 (Cron 表达式: 分 时 日 月 周)
  # 示例: 每天中午 12:00 执行
  cron: "0 12 * * *"
  # 是否合并错过的任务
  coalesce: true
  # 每日维护任务时间 (日报 + 清理)
  daily_report_cron: "0 0 * * *"

filter:
  match_score:
    min_threshold: 0.1 # 匹配度低于此分数的作品会被丢弃
    weight_in_sort: 0.6 # 排序时匹配度占的权重 (0.6表示匹配度占60%, 收藏数占40%)

  daily_limit: 20 # 单次任务推送上限 (Per-Run Limit)
    # 注意：此参数控制每次脚本运行时最多推送多少张
    # 如果您每小时运行一次，全天总量 = 24 * daily_limit
  exclude_ai: false # 过滤 AI 生成作品
  skip_ugoira: true # 丢弃 Ugoira 动图格式以节约内存和带宽
  content_type: "illust" # 内容类型过滤: "all" (全部), "illust" (仅插画), "manga" (仅漫画)
  max_per_artist: 3 # 单画师最多推送数
  artist_boost: 0.3 # 订阅画师加成
  min_create_days: 30 # 过滤 N 天前的作品
  r18_mode: "mixed" # 模式: mixed (混合), r18_only (纯R18), safe (仅全年龄). mixed=false, r18_only=true

  # 多样性增强 (让每次推送都不太一样)
  shuffle_factor: 0.15 # 随机打散因子 (0-0.5)，让排序结果每次不同
  exploration_ratio: 0.2 # 探索比例，从候选池随机抽取 20% 的"潜力股"

  daily_slate:
    enabled: true # 最终推送按动机配比和身份上限编排
    feature_ratio: 0.55
    character_ratio: 0.15
    copyright_ratio: 0.10
    exploration_ratio: 0.20
    max_per_character: 2
    max_per_copyright: 4

  display_tags:
    max_ip_count: 2 # 推送消息中最多展示多少个 IP 标签；feature 标签会优先展示

  # 黑名单标签
  blacklist_tags:
    - "R-18G"
    # AI 相关标签（如果开启 exclude_ai: true，这些也会被过滤）
    # - "AI"
    # - "AI生成"
    # - "AI art"
    # - "AIイラスト"
    # - "Stable Diffusion"
    # - "Midjourney"
    # - "NovelAI"

  # === 推荐增强选项 (借鉴 X 算法) ===

  # 画师多样性衰减：同一画师后续作品分数递减，防止信息茧房
  # 借鉴 X 算法 AuthorDiversityScorer
  # 公式: multiplier(position) = (1.0 - floor) × decay^position + floor
  author_diversity:
    enabled: true # 是否启用
    decay_factor: 0.5 # 衰减因子 (0.1-1.0, 越小衰减越快)
    floor: 0.1 # 保底系数 (避免完全降为0)

  # IP 多样性衰减：同一 IP 连续出现时，对后续作品降权，减少“全是同一个坑”的重复感
  ip_diversity:
    enabled: true
    decay_factor: 0.6
    floor: 0.1

  # 来源加成：不同策略来源的作品应用不同权重
  # 借鉴 X 算法 OON Scorer (Out-of-Network)
  source_boost:
    xp_search: 1.0 # XP 画像搜索 (基准)
    subscription: 1.1 # 订阅/关注 (轻微加成)
    ranking: 0.9 # 排行榜 (轻微降权)
    related: 1.15 # 关联作品 (发现加成)
    engagement_artists: 1.2 # 互动画师 (新策略, 高加成)

fetcher:
  bookmark_threshold:
    search: 1000 # 搜索结果的最低收藏数要求
    subscription: 0
    related: 0 # 关联推荐的最低收藏数要求

  subscribed_artists: [] # 额外关注的画师 ID 列表

  date_range_days: 7 # 获取最近 N 天的作品

  # 动态阈值配置 (冷门标签搜索优化)
  dynamic_threshold:
    min: 100 # 保底收藏数 (无论多冷门的标签都至少要这么多收藏)
    rate: 0.05 # 相对热度比例 (取该标签最高收藏作品的 5%)

  search_limit: 50 # 每次搜索获取的作品数量 (默认 50)

  ranking:
    enabled: true
    modes: ["day", "week", "month"]
    limit: 100

  match_score:
    min_threshold: 0.4
    weight_in_sort: 0.5

  # MAB 策略配额限制 (占比 0.0 - 1.0)
  mab_limits:
    # 至少保留 20% 给每个策略，防止饿死
    min_quota: 0.2
    # 任何单一策略最多占用 60%
    max_quota: 0.6

notifier:
  # 启用的推送通道列表: telegram, onebot, astrbot
  types: [telegram]

  # 多图作品配置
  max_pages: 10 # 打包发送的最大页数
  multi_page_mode: "cover_link" # 模式: cover_link / media_group

  # 邮件配置
  email:
    smtp_host: ""
    smtp_port: 465
    to_address: ""
    username: ""

  # Telegram Bot
  telegram:
    bot_token: "YOUR_BOT_TOKEN_HERE"
    # 推送目标 Chat ID (支持列表)
    chat_ids:
      - 123456789
    # 允许互动的用户 ID 列表 (安全设置)
    allowed_users:
      - 12345678
    # 话题 ID (可选，用于 Supergroup 话题)
    thread_id: null
    # 代理地址 (可选)
    proxy_url: null

    # 图片压缩配置
    image_quality: 85 # JPEG 压缩质量 (50-100)
    max_image_size: 2000 # 图片最大边长 (px)

    # Telegram Bot API 10.1 Rich Message（实验性，默认关闭）
    rich_message:
      enabled: false
      fallback_to_photo: true # Rich Message 发送失败时回退到普通图片消息
      image_mode: photo # photo=可点击放大; rich_card=Rich 卡片; hybrid=Photo + Rich

    # 批量推送格式: single / telegraph
    batch_mode: single
    batch_show_title: true
    batch_show_artist: true
    batch_show_tags: true
    # Topic 智能分流 (可选，用于 Supergroup 话题自动分类)
    topic_rules: {}
    # 例如：{"wallpaper": ["風景", "背景", "landscape", "scenery"]}
    topic_tag_mapping: {}

  # OneBot / QQ
  onebot:
    ws_url: "ws://127.0.0.1:3001"
    private_id: 12345678 # 私聊目标 QQ
    group_id: null # 群聊目标群号
    push_to_private: true
    push_to_group: false
    master_id: 12345678 # 主人 QQ

  # AstrBot (需安装 astrbot_plugin_http_adapter 插件)
  astrbot:
    # HTTP API 地址 (插件默认端口)
    http_url: "http://127.0.0.1:6185"
    # 目标会话标识 (从 AstrBot 管理面板获取)
    # 格式: 平台:类型:ID, 如 QQOfficial:group:123456
    unified_msg_origin: ""
    # API 密钥 (如果插件启用了认证)
    api_key: ""
    # 图片压缩
    image_quality: 85
    max_image_size: 1500

# 反馈与权重配置
feedback:
  like_boost: 0.5 # 喜欢时权重增加量
  dislike_penalty: 0.3 # 不喜欢时权重减少量
  dislike_threshold: 3 # 累计不喜欢达到此次数时，提示建议屏蔽
  max_chain_depth: 3 # 单图连锁深度上限 (A→B→C共3层)
  related_push_limit: 1 # 每次反馈触发关联推送的数量

network:
  max_concurrency: 5
  random_delay: [1.0, 3.0]
  requests_per_minute: 60

web:
  enabled: false
  require_login_password: true  # 设为 false 可关闭 Web 登录密码验证（仅建议内网/本机使用）
  password: "YOUR_PASSWORD_HERE"
  port: 8000
