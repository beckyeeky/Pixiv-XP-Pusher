{% extends "base.html" %}

{% block title %}登录 - Pixiv-XP-Pusher{% endblock %}

{% block content %}
<section class="auth-card">
    <header class="auth-brand">
        <span class="app-brand__mark" aria-hidden="true">PX</span>
        <div>
            <h1 class="auth-title">登录管理控制台</h1>
            <p class="auth-description">输入访问密码以继续。</p>
        </div>
    </header>

    {% if error %}
    <div class="status-banner" data-kind="error" role="alert" style="margin-bottom: 1rem;">{{ error }}</div>
    {% endif %}

    <form class="auth-form" method="post" action="/login">
        <label for="loginPassword">访问密码
            <input id="loginPassword" type="password" name="password" autocomplete="current-password" required autofocus>
        </label>
        <button type="submit" class="btn">登录</button>
    </form>
</section>
{% endblock %}
