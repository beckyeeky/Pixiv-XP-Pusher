<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>{% block title %}Pixiv-XP-Pusher{% endblock %}</title>
    <style>
        :root {
            /* Crimson 高级暗色主题 */
            --bg-primary: #0b0f14;
            --bg-secondary: #0f1620;
            --bg-card: #111b26;
            --text-primary: #e6eaf0;
            --text-secondary: #9aa4b2;
            --accent: #e11d48;          /* Crimson */
            --accent-soft: #2a141c;     /* 深酒红底 */
            --border: #223042;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: radial-gradient(1200px 800px at 20% -10%, rgba(225, 29, 72, 0.14), transparent 55%),
                        radial-gradient(900px 600px at 90% 10%, rgba(225, 29, 72, 0.10), transparent 60%),
                        var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            color: var(--accent);
        }

        a:hover {
            opacity: 0.9;
        }

        /* 导航栏 */
        body > nav {
            background: var(--bg-secondary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        body > nav .logo {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
        }

        body > nav .nav-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        body > nav .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s, background-color 0.2s;
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
        }

        body > nav .nav-links a:hover,
        body > nav .nav-links a.active {
            color: var(--text-primary);
            background: rgba(225, 29, 72, 0.14);
        }

        /* 主内容区 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 卡片 */
        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 60%), var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow-soft);
        }

        .card:hover {
            border-color: rgba(225, 29, 72, 0.35);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* 标签云 */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background: var(--accent-soft);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tag .weight {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .tag--previewable {
            cursor: default;
        }

        .tag-preview-tooltip {
            position: fixed;
            z-index: 1000;
            width: min(640px, calc(100vw - 32px));
            padding: 0.9rem;
            background: rgba(15, 22, 32, 0.98);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
        }

        .tag-preview-tooltip.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .tag-preview-tooltip__header {
            margin-bottom: 0.7rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .tag-preview-tooltip__header strong {
            color: var(--text-primary);
        }

        .tag-preview-tooltip__gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.65rem;
            min-height: 120px;
        }

        .tag-preview-tooltip__gallery img {
            width: 100%;
            aspect-ratio: 1.25;
            object-fit: cover;
            border-radius: 8px;
            background: var(--bg-primary);
        }

        .tag-preview-tooltip__message {
            display: grid;
            place-items: center;
            grid-column: 1 / -1;
            min-height: 120px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* 统计数字 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* 画廊网格 */
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .gallery-total,
        .gallery-hint,
        .gallery-auto-load,
        .gallery-pagination__jump {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        .gallery-toolbar {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .gallery-toolbar-btn {
            min-width: 8.5rem;
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border);
            box-shadow: none;
        }

        .gallery-toolbar-btn.is-active {
            background: var(--accent);
            border-color: rgba(225, 29, 72, 0.45);
            box-shadow: 0 8px 18px rgba(225, 29, 72, 0.12);
        }

        .gallery-hint {
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .gallery-grid {
            gap: 16px;
            align-items: start;
        }

        .gallery-grid--paged {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .gallery-grid--masonry {
            --gallery-columns: 4;
            --gallery-gap: 16px;
            --gallery-row-height: 8px;
            display: grid;
            grid-template-columns: repeat(var(--gallery-columns), minmax(0, 1fr));
            grid-auto-rows: var(--gallery-row-height);
            gap: var(--gallery-gap);
        }

        .gallery-item {
            position: relative;
        }

        .gallery-grid--paged .gallery-item {
            aspect-ratio: 1;
        }

        .gallery-grid--masonry .gallery-item {
            grid-row-end: span 1;
        }

        .gallery-item__inner {
            position: relative;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-secondary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #2a2a3e;
            transition: transform 0.3s ease;
        }

        .gallery-grid--masonry .gallery-item img {
            height: auto;
            display: block;
            background: #2a2a3e;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        .gallery-item .overlay {
            position: absolute;
            inset: auto 0 0 0;
            padding: 0.85rem;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.82));
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .gallery-item .overlay a {
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .gallery-auto-load {
            min-height: 2rem;
            margin-top: 1rem;
            line-height: 1.5;
        }

        .gallery-pagination {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .gallery-pagination[hidden] {
            display: none;
        }

        .gallery-pagination__buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gallery-pagination__indicator {
            display: inline-flex;
            align-items: center;
            padding: 0 1rem;
            background: var(--bg-secondary);
            border-radius: 6px;
            font-weight: 500;
            color: #fff;
        }

        .gallery-pagination__jump {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .gallery-pagination__jump input {
            width: 64px;
            padding: 0.3rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-primary);
            color: white;
            text-align: center;
        }

        .gallery-sentinel {
            width: 100%;
            height: 1px;
        }

        @media (max-width: 1023px) {
            .gallery-grid--masonry {
                --gallery-columns: 3;
            }

            .gallery-grid--paged {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 767px) {
            .gallery-grid--masonry {
                --gallery-columns: 2;
            }

            .gallery-grid--paged {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 479px) {
            .gallery-grid--masonry,
            .gallery-grid--paged {
                grid-template-columns: 1fr;
            }
        }

        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.65rem 1.15rem;
            background: var(--accent);
            color: #fff;
            border: 1px solid rgba(225, 29, 72, 0.45);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.92rem;
            text-decoration: none;
            transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
            box-shadow: 0 8px 18px rgba(225, 29, 72, 0.12);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(225, 29, 72, 0.18);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            box-shadow: none;
        }

        .btn.secondary:hover {
            border-color: rgba(225, 29, 72, 0.35);
            color: var(--text-primary);
            box-shadow: none;
        }

        /* 表单 */
        input,
        select,
        textarea,
        button {
            padding: 0.75rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: rgba(225, 29, 72, 0.65);
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.18);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            body > nav {
                flex-direction: column;
                gap: 1rem;
            }

            body > nav .nav-links {
                justify-content: center;
                width: 100%;
            }

            body > nav .nav-links a {
                margin: 0;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    {% block extra_head %}{% endblock %}
</head>

<body>
    {% if active_page %}
    <div class="app-shell" data-app-shell>
        <aside class="app-sidebar" data-app-sidebar aria-label="主导航">
            <a class="app-brand" href="/dashboard">
                <span class="app-brand__mark" aria-hidden="true">PX</span>
                <span class="app-brand__text">
                    <span class="app-brand__name">Pixiv XP Pusher</span>
                    <span class="app-brand__caption">推荐管理控制台</span>
                </span>
            </a>
            <nav class="app-nav">
                <span class="app-nav__label">工作区</span>
                <a href="/dashboard" class="app-nav__link {% if active_page == 'dashboard' %}is-active{% endif %}" {% if active_page == 'dashboard' %}aria-current="page"{% endif %}>
                    <span class="app-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg></span>
                    概览
                </a>
                <a href="/gallery" class="app-nav__link {% if active_page == 'gallery' %}is-active{% endif %}" {% if active_page == 'gallery' %}aria-current="page"{% endif %}>
                    <span class="app-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m5 17 4.5-4 3.2 2.8 2.5-2.1L19 17"/></svg></span>
                    作品画廊
                </a>
                <a href="/tags" class="app-nav__link {% if active_page == 'tags' %}is-active{% endif %}" {% if active_page == 'tags' %}aria-current="page"{% endif %}>
                    <span class="app-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 13 13 20l-9-9V4h7l9 9Z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg></span>
                    标签管理
                </a>
                <span class="app-nav__label">管理</span>
                <a href="/settings" class="app-nav__link {% if active_page == 'settings' %}is-active{% endif %}" {% if active_page == 'settings' %}aria-current="page"{% endif %}>
                    <span class="app-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H3v-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.5V3h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg></span>
                    系统设置
                </a>
                <a href="/import-export" class="app-nav__link {% if active_page == 'import_export' %}is-active{% endif %}" {% if active_page == 'import_export' %}aria-current="page"{% endif %}>
                    <span class="app-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/></svg></span>
                    数据管理
                </a>
            </nav>
            <div class="app-sidebar__footer">
                <a href="/logout" class="app-nav__link">
                    <span class="app-nav__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5m4-4 4-4-4-4m4 4H9"/></svg></span>
                    退出登录
                </a>
            </div>
        </aside>
        <button class="app-overlay" type="button" data-menu-overlay aria-label="关闭导航"></button>
        <div class="app-main">
            <header class="app-mobile-header">
                <span class="app-mobile-header__title">Pixiv XP Pusher</span>
                <button class="app-menu-button" type="button" data-menu-toggle aria-expanded="false" aria-label="打开导航">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>
            </header>
            <main class="app-content" id="main-content">
    {% else %}
    <main class="auth-main" id="main-content">
    {% endif %}
                {% block content %}{% endblock %}
    {% if active_page %}
            </main>
        </div>
    </div>
    {% else %}
    </main>
    {% endif %}

    <div class="ui-toast-region" id="uiToastRegion" aria-live="polite" aria-atomic="false"></div>
    <dialog class="ui-dialog" id="uiConfirmDialog" aria-labelledby="uiConfirmTitle">
        <div class="ui-dialog__body">
            <h2 class="ui-dialog__title" id="uiConfirmTitle">确认操作</h2>
            <p class="ui-dialog__message" id="uiConfirmMessage"></p>
        </div>
        <div class="ui-dialog__actions">
            <button class="btn-secondary" id="uiConfirmCancel" type="button">取消</button>
            <button class="btn-primary" id="uiConfirmAccept" type="button">确认</button>
        </div>
    </dialog>

    <script src="{{ url_for('static', path='/ui.js') }}" defer></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
