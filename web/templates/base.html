<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>{% block title %}Pixiv-XP-Pusher{% endblock %}</title>
    <style>
        :root {
            /* Crimson 高级暗色主题 */
            --bg-primary: #0b0f14;
            --bg-secondary: #0f1620;
            --bg-card: #111b26;
            --text-primary: #e6eaf0;
            --text-secondary: #9aa4b2;
            --accent: #e11d48;          /* Crimson */
            --accent-soft: #2a141c;     /* 深酒红底 */
            --border: #223042;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background: radial-gradient(1200px 800px at 20% -10%, rgba(225, 29, 72, 0.14), transparent 55%),
                        radial-gradient(900px 600px at 90% 10%, rgba(225, 29, 72, 0.10), transparent 60%),
                        var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        a {
            color: var(--accent);
        }

        a:hover {
            opacity: 0.9;
        }

        /* 导航栏 */
        nav {
            background: var(--bg-secondary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        nav .logo {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
        }

        nav .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 2rem;
            transition: color 0.2s;
        }

        nav .nav-links a:hover,
        nav .nav-links a.active {
            color: var(--text-primary);
        }

        /* 主内容区 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 卡片 */
        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 60%), var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow-soft);
        }

        .card:hover {
            border-color: rgba(225, 29, 72, 0.35);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* 标签云 */
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background: var(--accent-soft);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tag .weight {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        /* 统计数字 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* 画廊网格 */
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .gallery-total,
        .gallery-toolbar__label,
        .gallery-hint,
        .gallery-auto-load,
        .gallery-pagination__jump {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        .gallery-toolbar {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .gallery-layout-toggle {
            min-width: 8.25rem;
        }

        .gallery-hint {
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .gallery-grid {
            gap: 16px;
            align-items: start;
        }

        .gallery-grid--paged {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .gallery-grid--masonry {
            --gallery-columns: 4;
            --gallery-gap: 16px;
            --gallery-row-height: 8px;
            display: grid;
            grid-template-columns: repeat(var(--gallery-columns), minmax(0, 1fr));
            grid-auto-rows: var(--gallery-row-height);
            gap: var(--gallery-gap);
        }

        .gallery-item {
            position: relative;
        }

        .gallery-grid--paged .gallery-item {
            aspect-ratio: 1;
        }

        .gallery-grid--masonry .gallery-item {
            grid-row-end: span 1;
        }

        .gallery-item__inner {
            position: relative;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg-secondary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            background: #2a2a3e;
            transition: transform 0.3s ease;
        }

        .gallery-grid--masonry .gallery-item img {
            height: auto;
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        .gallery-item .overlay {
            position: absolute;
            inset: auto 0 0 0;
            padding: 0.85rem;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.82));
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .gallery-item .overlay a {
            color: #fff;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .gallery-auto-load {
            min-height: 2rem;
            margin-top: 1rem;
            line-height: 1.5;
        }

        .gallery-pagination {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .gallery-pagination[hidden] {
            display: none;
        }

        .gallery-pagination__buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gallery-pagination__indicator {
            display: inline-flex;
            align-items: center;
            padding: 0 1rem;
            background: var(--bg-secondary);
            border-radius: 6px;
            font-weight: 500;
            color: #fff;
        }

        .gallery-pagination__jump {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .gallery-pagination__jump input {
            width: 64px;
            padding: 0.3rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-primary);
            color: white;
            text-align: center;
        }

        .gallery-sentinel {
            width: 100%;
            height: 1px;
        }

        @media (max-width: 1023px) {
            .gallery-grid--masonry {
                --gallery-columns: 3;
            }

            .gallery-grid--paged {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 767px) {
            .gallery-grid--masonry {
                --gallery-columns: 2;
            }

            .gallery-grid--paged {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 479px) {
            .gallery-grid--masonry,
            .gallery-grid--paged {
                grid-template-columns: 1fr;
            }
        }

        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.65rem 1.15rem;
            background: var(--accent);
            color: #fff;
            border: 1px solid rgba(225, 29, 72, 0.45);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.92rem;
            text-decoration: none;
            transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
            box-shadow: 0 8px 18px rgba(225, 29, 72, 0.12);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(225, 29, 72, 0.18);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            box-shadow: none;
        }

        .btn.secondary:hover {
            border-color: rgba(225, 29, 72, 0.35);
            color: var(--text-primary);
            box-shadow: none;
        }

        /* 表单 */
        input,
        select,
        textarea,
        button {
            padding: 0.75rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: rgba(225, 29, 72, 0.65);
            box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.18);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 1rem;
            }

            nav .nav-links a {
                margin: 0 1rem;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>
    <nav>
        <div class="logo">🎨 Pixiv-XP-Pusher</div>
        <div class="nav-links">
            <a href="/dashboard" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/gallery" class="{% if active_page == 'gallery' %}active{% endif %}">Gallery</a>
            <a href="/tags" class="{% if active_page == 'tags' %}active{% endif %}">Tags</a>
            <a href="/settings" class="{% if active_page == 'settings' %}active{% endif %}">Settings</a>
            <a href="/import-export" class="{% if active_page == 'import_export' %}active{% endif %}">Import/Export</a>
            <a href="/logout">登出</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block extra_scripts %}{% endblock %}
</body>

</html>
